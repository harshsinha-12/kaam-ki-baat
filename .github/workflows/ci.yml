name: ci
on:
  push:
    branches: [main, "feat/**", "claude/**", "codex/**"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run snapshot:fixture -- --out /tmp/snapshot.json || echo "snapshot needs GitHub API; non-blocking"
      - run: npm run build
